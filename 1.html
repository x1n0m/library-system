<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Библиотечная система</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <div id="auth-screen" class="min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Электронная Библиотека</h1>
            
            <div class="flex mb-6 bg-gray-100 p-1 rounded-lg">
                <button onclick="setRole('reader')" id="btn-reader" class="flex-1 py-2 text-sm font-medium rounded-md bg-white shadow text-blue-600 transition">Читатель</button>
                <button onclick="setRole('librarian')" id="btn-librarian" class="flex-1 py-2 text-sm font-medium rounded-md text-gray-500 transition">Библиотекарь</button>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Электронная почта или логин</label>
                    <input type="text" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="user@example.com">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                    <input type="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                    Войти
                </button>
            </form>
        </div>
    </div>

    <div id="app-screen" class="hidden min-h-screen flex flex-col">
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
                <div class="flex items-center space-x-6">
                    <span class="text-xl font-bold text-blue-600">Библиотека</span>
                    <nav class="hidden md:flex space-x-4">
                        <button class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md">Каталог книг</button>
                        <button class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md">Мои книги</button>
                        <button class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md">История</button>
                    </nav>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-role-label" class="text-sm text-gray-500 bg-gray-100 px-3 py-1 rounded-full">Роль: Читатель</span>
                    <button onclick="handleLogout()" class="text-sm text-red-600 hover:underline">Выйти</button>
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8">
            <div class="mb-8 flex justify-between items-center">
                <h2 class="text-2xl font-bold text-gray-800">Каталог книг</h2>
                <div class="space-x-2">
                    <button class="px-4 py-2 bg-white border rounded-lg shadow-sm text-gray-600 hover:bg-gray-50">Фильтры</button>
                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Добавить книгу (пусто)</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border flex flex-col justify-between">
                    <div>
                        <div class="h-40 bg-gray-200 rounded-lg mb-4 flex items-center justify-center text-gray-400">Обложка книги</div>
                        <h3 class="font-bold text-lg text-gray-800">Название книги №1</h3>
                        <p class="text-sm text-gray-500 mb-4">Автор: И. И. Иванов</p>
                    </div>
                    <button class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200 transition">Подробнее</button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border flex flex-col justify-between">
                    <div>
                        <div class="h-40 bg-gray-200 rounded-lg mb-4 flex items-center justify-center text-gray-400">Обложка книги</div>
                        <h3 class="font-bold text-lg text-gray-800">Название книги №2</h3>
                        <p class="text-sm text-gray-500 mb-4">Автор: П. Петров</p>
                    </div>
                    <button class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200 transition">Подробнее</button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border flex flex-col justify-between">
                    <div>
                        <div class="h-40 bg-gray-200 rounded-lg mb-4 flex items-center justify-center text-gray-400">Обложка книги</div>
                        <h3 class="font-bold text-lg text-gray-800">Название книги №3</h3>
                        <p class="text-sm text-gray-500 mb-4">Автор: С. Смирнов</p>
                    </div>
                    <button class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg hover:bg-gray-200 transition">Подробнее</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        let currentRole = 'reader';

        function setRole(role) {
            currentRole = role;
            const btnReader = document.getElementById('btn-reader');
            const btnLibrarian = document.getElementById('btn-librarian');

            if (role === 'reader') {
                btnReader.className = "flex-1 py-2 text-sm font-medium rounded-md bg-white shadow text-blue-600 transition";
                btnLibrarian.className = "flex-1 py-2 text-sm font-medium rounded-md text-gray-500 transition";
            } else {
                btnLibrarian.className = "flex-1 py-2 text-sm font-medium rounded-md bg-white shadow text-blue-600 transition";
                btnReader.className = "flex-1 py-2 text-sm font-medium rounded-md text-gray-500 transition";
            }
        }

        function handleLogin(event) {
            event.preventDefault();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            
            const label = document.getElementById('user-role-label');
            label.innerText = currentRole === 'reader' ? 'Роль: Читатель' : 'Роль: Библиотекарь';
        }

        function handleLogout() {
            document.getElementById('app-screen').classList.add('hidden');
            document.getElementById('auth-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
